<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#166B4A">
    <title th:text="${pageTitle} + ' | Access+'">Access+</title>
    <link rel="stylesheet" th:href="@{/css/accessplus.css}">
    <script th:src="@{/js/rating-stars.js}" defer></script>
</head>
<body>
<nav th:fragment="bottomNav(activeNav)" class="bottom-nav" aria-label="Navegação principal">
    <a th:href="@{/app}" th:classappend="${activeNav == 'inicio'} ? ' is-active' : ''" class="nav-item">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg><span>Início</span>
    </a>
    <a th:href="@{/app/explorar}" th:classappend="${activeNav == 'explorar'} ? ' is-active' : ''" class="nav-item">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><span>Explorar</span>
    </a>
    <a th:href="@{/app/avaliacoes}" th:classappend="${activeNav == 'avaliacoes'} ? ' is-active' : ''" class="nav-item">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-3-6 3z"/></svg><span>Avaliações</span>
    </a>
    <a th:href="@{/app/sobre}" th:classappend="${activeNav == 'sobre'} ? ' is-active' : ''" class="nav-item">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg><span>Sobre</span>
    </a>
</nav>

<fieldset th:fragment="rating(fieldName, label, optional, selectedValue)" class="rating-field" data-rating-widget>
    <legend th:text="${label}">Nota</legend>
    <p class="rating-guidance" th:if="${optional}">Opcional: escolha uma nota ou mantenha “Não informar”.</p>
    <p class="rating-guidance" th:unless="${optional}">Escolha de 0 a 5 em incrementos de 0,5.</p>
    <div class="rating-controls" role="radiogroup" th:attr="aria-label=${label}">
        <div class="rating-stars" aria-live="polite">
            <input class="rating-choice" type="radio" th:id="${fieldName + '-zero'}" th:name="${fieldName}" value="0" th:checked="${selectedValue != null and selectedValue.doubleValue() == 0.0}">
            <label class="rating-zero" th:for="${fieldName + '-zero'}"><span aria-hidden="true">0</span><span class="sr-only">0 de 5</span></label>
            <span class="rating-star" th:each="star : ${#numbers.sequence(1, 5)}">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 2.8 2.83 5.73 6.32.92-4.57 4.46 1.08 6.29L12 17.21l-5.66 2.97 1.08-6.29-4.57-4.46 6.32-.92z"/></svg>
                <input class="rating-choice" type="radio" th:id="${fieldName + '-' + star + '-half'}" th:name="${fieldName}" th:value="${star - 0.5}" th:checked="${selectedValue != null and selectedValue.doubleValue() == star - 0.5}">
                <label class="rating-hit rating-hit--left" th:for="${fieldName + '-' + star + '-half'}"><span class="sr-only" th:text="${#numbers.formatDecimal(star - 0.5, 1, 1) + ' de 5'}">0,5 de 5</span></label>
                <input class="rating-choice" type="radio" th:id="${fieldName + '-' + star + '-full'}" th:name="${fieldName}" th:value="${star}" th:checked="${selectedValue != null and selectedValue.doubleValue() == star}">
                <label class="rating-hit rating-hit--right" th:for="${fieldName + '-' + star + '-full'}"><span class="sr-only" th:text="${star + ' de 5'}">1 de 5</span></label>
            </span>
        </div>
        <div class="rating-actions">
            <span class="rating-value" data-rating-output aria-live="polite">Selecione uma nota</span>
            <button th:if="${!optional}" class="rating-clear" type="button" data-rating-clear>Limpar seleção</button>
            <span th:if="${optional}" class="rating-not-informed"><input class="rating-choice rating-choice--not-informed" type="radio" th:id="${fieldName + '-nao-informar'}" th:name="${fieldName}" value="" th:checked="${selectedValue == null}"><label th:for="${fieldName + '-nao-informar'}">Não informar</label></span>
        </div>
    </div>
</fieldset>
</body>
</html>
